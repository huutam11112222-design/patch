name: IFix Binary Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - asset/cache_res
      - tools/IFix.sh
      - .github/workflows/IFix.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build IFXB
        shell: bash
        run: |
          chmod +x tools/IFix.sh
          bash tools/IFix.sh build asset/cache_res cache_res-patch.bytes

      - name: Verify binary
        run: |
          test -f cache_res-patch.bytes
          test "$(head -c 4 cache_res-patch.bytes)" = "IFXB"
          file cache_res-patch.bytes
          xxd -l 64 cache_res-patch.bytes
          sha256sum cache_res-patch.bytes

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cache_res-patch
          path: cache_res-patch.bytes

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cache_res-patch.bytes

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "IFix: update binary patch"
          git push origin HEAD:main
